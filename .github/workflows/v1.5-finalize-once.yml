name: V1.5 Finalize Once

on:
  push:
    branches:
      - feat/v1.5-security-hardening
    paths:
      - .github/workflows/v1.5-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v1.5-security-hardening
          fetch-depth: 0
      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck openssh-server
      - name: Apply final v1.5 release patch
        run: python3 .github/v1.5_finalize.py
      - name: Document integration-test lint boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/integration/sshd_integration_test.sh')
          text = p.read_text()
          marker = '#!/usr/bin/env bash\n'
          note = '# shellcheck disable=SC1091,SC2034,SC2024 # sourced SKM globals and runner-owned log redirect are intentional\n'
          if note not in text:
              if text.count(marker) != 1:
                  raise SystemExit('integration shebang not found exactly once')
              p.write_text(text.replace(marker, marker + note, 1))
          PY
      - name: Generate distributable
        run: make build
      - name: Lint final release candidate
        run: make lint
      - name: Run full source and generated checks
        run: make ci
      - name: Run real OpenSSH integration test
        run: bash tests/integration/sshd_integration_test.sh
      - name: Remove temporary v1.5 tooling
        run: |
          rm -f .github/v1.5_access_patch.py
          rm -f .github/v1.5_structured_json_patch.py
          rm -f .github/v1.5_doctor_lint_patch.py
          rm -f .github/v1.5_finalize.py
          rm -f .github/workflows/v1.5-validation.yml
          rm -f .github/workflows/v1.5-structured-json-once.yml
          rm -f .github/workflows/v1.5-finalize-once.yml
      - name: Commit verified release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: prepare v1.5.0 release"
          git push origin HEAD:feat/v1.5-security-hardening
