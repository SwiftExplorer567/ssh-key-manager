name: Feature v1.2 Build

on:
  push:
    branches:
      - feat/identity-registry-trust-audit

permissions:
  contents: write

jobs:
  build-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Integrate identity-aware display hardening
        run: python3 .github/scripts/refactor-v12.py

      - name: Build generated executable
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Commit validated v1.2 sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/access.sh src/identities.sh src/security_display.sh ssh-key-manager ssh-key-manager.sha256
          git rm .github/workflows/feature-v12-build.yml .github/scripts/refactor-v12.py
          git commit -m "refactor: integrate identity-aware key rendering"
          git push origin "HEAD:${GITHUB_REF_NAME}"
