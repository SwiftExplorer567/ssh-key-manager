name: Feature v1.3 Build

on:
  push:
    branches:
      - feat/desired-state-policy

permissions:
  contents: write

jobs:
  build-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply v1.3 integration
        run: python3 tools/apply_v13.py

      - name: Build generated executable
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Commit validated v1.3 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime.sh src/identities.sh src/policy.sh src/cli.sh \
            build/bundle.sh build/lint.sh install.sh \
            tests/helpers/test_helper.sh tests/test.sh tests/policy_test.sh \
            docs/desired-state-policy.md ssh-key-manager ssh-key-manager.sha256
          git rm tools/apply_v13.py .github/workflows/feature-v13-build.yml
          git commit -m "feat: integrate desired-state policy"
          git push origin "HEAD:${GITHUB_REF_NAME}"
