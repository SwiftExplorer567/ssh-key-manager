name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Verify
        run: make ci

      - name: Match tag and source version
        shell: bash
        run: |
          source_version=$(sed -n 's/^VERSION="\([0-9.]*\)"/\1/p' ssh-key-manager | head -1)
          tag_version="${GITHUB_REF_NAME#v}"
          test -n "$source_version"
          test "$tag_version" = "$source_version"

      - name: Prepare checksummed release assets
        run: sha256sum ssh-key-manager > ssh-key-manager.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" ssh-key-manager ssh-key-manager.sha256 --title "SSH Key Manager $GITHUB_REF_NAME" --generate-notes
