name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Verify
        run: make test && make lint

      - name: Match tag and source version
        shell: bash
        run: |
          source_version=$(sed -n 's/^VERSION="\([0-9.]*\)"/\1/p' ssh-key-manager | head -1)
          tag_version="${GITHUB_REF_NAME#v}"
          test -n "$source_version"
          test "$tag_version" = "$source_version"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "SSH Key Manager $GITHUB_REF_NAME" --generate-notes
