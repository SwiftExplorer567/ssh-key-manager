name: V1.5.1 Settings Permission Hotfix Once

on:
  push:
    branches:
      - fix/v1.5.1-settings-permissions

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v1.5.1-settings-permissions
          fetch-depth: 0

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Apply v1.5.1 hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('src/runtime.sh')
          text = runtime.read_text()
          old = 'VERSION="1.5.0"'
          if text.count(old) != 1:
              raise SystemExit(f'runtime version count={text.count(old)}')
          text = text.replace(old, 'VERSION="1.5.1"', 1)

          anchor = '    chmod 600 "$HOSTS_FILE" "$IDENTITIES_FILE" "$POLICY_FILE" "$KNOWN_HOSTS_FILE" 2>/dev/null || true\n'
          replacement = anchor + '''    if [[ -f "$SETTINGS_FILE" && ! -L "$SETTINGS_FILE" ]]; then
              chmod 600 "$SETTINGS_FILE" 2>/dev/null || true
          fi
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'runtime chmod anchor count={text.count(anchor)}')
          runtime.write_text(text.replace(anchor, replacement, 1))

          installer = Path('install.sh')
          text = installer.read_text()
          if text.count(old) != 1:
              raise SystemExit(f'installer version count={text.count(old)}')
          installer.write_text(text.replace(old, 'VERSION="1.5.1"', 1))

          test = Path('tests/runtime_hosts_test.sh')
          text = test.read_text()
          anchor = '''config_attack_marker="$TEST_ROOT/config-must-not-execute"
          '''
          addition = '''# Runtime migration hardening: legacy settings files may predate the 0600 policy.
          printf '%s\\n' 'BRAND="Legacy Settings"' > "$SKM_SETTINGS_FILE"
          chmod 644 "$SKM_SETTINGS_FILE"
          ensure_runtime
          assert_eq "600" "$(file_mode "$SKM_SETTINGS_FILE")" "runtime normalizes existing settings permissions"

          # Never follow a settings symlink just to repair permissions.
          settings_target="$TEST_ROOT/settings-target"
          printf '%s\\n' 'BRAND="Symlink Target"' > "$settings_target"
          chmod 644 "$settings_target"
          rm -f "$SKM_SETTINGS_FILE"
          ln -s "$settings_target" "$SKM_SETTINGS_FILE"
          ensure_runtime
          assert_eq "644" "$(file_mode "$settings_target")" "runtime does not chmod settings symlink targets"
          rm -f "$SKM_SETTINGS_FILE"

          config_attack_marker="$TEST_ROOT/config-must-not-execute"
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'runtime test anchor count={text.count(anchor)}')
          test.write_text(text.replace(anchor, addition, 1))
          PY

          cat > docs/v1.5.1.md <<'EOF'
          # SSH Key Manager v1.5.1

          Version 1.5.1 is a focused permissions-hardening patch for existing installations.

          ## Fixed

          - SKM now normalizes an existing `~/.config/ssh-key-manager/config` settings file to mode `0600` during runtime initialization.
          - The migration is symlink-safe: SKM does not follow a settings-file symlink merely to change permissions on its target.
          - A regression test covers both legacy `0644 -> 0600` normalization and symlink-target preservation.

          ## Upgrade notes

          No identity registry, policy, host-trust, or machine configuration migration is required.
          After upgrading, `skm doctor` should report `SKM settings permissions: 600` without requiring a manual `chmod`.
          EOF

      - name: Rebuild and validate
        shell: bash
        run: |
          set -euo pipefail
          make build
          make ci
          test "$(sed -n 's/^VERSION="\([0-9.]*\)"/\1/p' src/runtime.sh | head -1)" = "1.5.1"
          test "$(sed -n 's/^VERSION="\([0-9.]*\)"/\1/p' install.sh | head -1)" = "1.5.1"
          test "$(sed -n 's/^VERSION="\([0-9.]*\)"/\1/p' ssh-key-manager | head -1)" = "1.5.1"

      - name: Commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v1.5.1-hotfix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime.sh install.sh tests/runtime_hosts_test.sh docs/v1.5.1.md ssh-key-manager ssh-key-manager.sha256 .github/workflows/v1.5.1-hotfix-once.yml
          git commit -m "fix: normalize settings permissions on startup"
          git push origin HEAD:fix/v1.5.1-settings-permissions
