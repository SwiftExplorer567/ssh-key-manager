name: V1.5 Access Hardening Once

on:
  push:
    branches:
      - feat/v1.5-security-hardening
    paths:
      - .github/workflows/v1.5-structured-json-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v1.5-security-hardening
      - name: Harden local keys and doctor
        run: python3 .github/v1.5_access_patch.py
      - name: Commit local trust hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/access.sh tests/access_test.sh
          git commit -m "feat: harden local key and doctor checks"
          git push origin HEAD:feat/v1.5-security-hardening
