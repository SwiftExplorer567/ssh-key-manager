name: V1.5 Structured JSON Once

on:
  push:
    branches:
      - feat/v1.5-security-hardening
    paths:
      - .github/workflows/v1.5-structured-json-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v1.5-security-hardening
      - name: Build structured finding model
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected replacement target exactly once, got {s.count(old)}')
              p.write_text(s.replace(old, new))

          replace_once('src/identities.sh', '''AUDIT_ISSUES=0

audit_issue() {
    AUDIT_ISSUES=$((AUDIT_ISSUES + 1))
    warn "$*"
}
''', '''AUDIT_ISSUES=0
declare -a AUDIT_FINDING_CODES AUDIT_FINDING_MESSAGES

audit_code_for_message() {
    case "$1" in
        *"invalid or unsupported authorized_keys entry"*) printf 'AUTHORIZED_ENTRY_INVALID' ;;
        *"control characters in comment"*) printf 'KEY_COMMENT_CONTROL_CHARS' ;;
        *"duplicate authorized fingerprint"*) printf 'AUTHORIZED_DUPLICATE' ;;
        *"retired identity"*"still authorized"*) printf 'RETIRED_AUTHORIZED' ;;
        *"unknown authorized fingerprint"*) printf 'AUTHORIZED_UNKNOWN' ;;
        *"public key path is a symlink"*) printf 'PUBLIC_KEY_SYMLINK' ;;
        *"duplicate public identity"*) printf 'PUBLIC_KEY_DUPLICATE' ;;
        *"broad 'Host *' block sets IdentityFile"*) printf 'SSH_CONFIG_BROAD_IDENTITY' ;;
        *"authorized_keys could not be read"*) printf 'AUDIT_INCOMPLETE' ;;
        *"policy: unknown fingerprint"*) printf 'POLICY_UNKNOWN_IDENTITY' ;;
        *"policy: unknown machine"*) printf 'POLICY_UNKNOWN_MACHINE' ;;
        *"policy: retired identity"*) printf 'POLICY_RETIRED_EXPECTATION' ;;
        *"MISSING expected identity"*) printf 'POLICY_MISSING' ;;
        *"EXCESS identity"*) printf 'POLICY_EXCESS' ;;
        *) printf 'TRUST_ISSUE' ;;
    esac
}

audit_issue() {
    local message="$*" code
    code=$(audit_code_for_message "$message")
    AUDIT_ISSUES=$((AUDIT_ISSUES + 1))
    AUDIT_FINDING_CODES+=("$code")
    AUDIT_FINDING_MESSAGES+=("$message")
    warn "$message"
}
''')
          replace_once('src/identities.sh', '''    AUDIT_ISSUES=0
    load_identities
''', '''    AUDIT_ISSUES=0
    AUDIT_FINDING_CODES=()
    AUDIT_FINDING_MESSAGES=()
    load_identities
''')

          replace_once('src/policy.sh', '''POLICY_DRIFT=0

policy_drift_issue() {
    POLICY_DRIFT=$((POLICY_DRIFT + 1))
    warn "$*"
}
''', '''POLICY_DRIFT=0
declare -a POLICY_FINDING_CODES POLICY_FINDING_MESSAGES

policy_code_for_message() {
    case "$1" in
        "MISSING "*) printf 'POLICY_MISSING' ;;
        "EXCESS "*) printf 'POLICY_EXCESS' ;;
        *"desired-state check is incomplete"*) printf 'POLICY_INCOMPLETE' ;;
        *"policy: unknown fingerprint"*) printf 'POLICY_UNKNOWN_IDENTITY' ;;
        *"policy: unknown machine"*) printf 'POLICY_UNKNOWN_MACHINE' ;;
        *"policy: retired identity"*) printf 'POLICY_RETIRED_EXPECTATION' ;;
        *) printf 'POLICY_DRIFT' ;;
    esac
}

policy_drift_issue() {
    local message="$*" code
    code=$(policy_code_for_message "$message")
    POLICY_DRIFT=$((POLICY_DRIFT + 1))
    POLICY_FINDING_CODES+=("$code")
    POLICY_FINDING_MESSAGES+=("$message")
    warn "$message"
}
''')
          replace_once('src/policy.sh', '''    POLICY_DRIFT=0
    load_identities
''', '''    POLICY_DRIFT=0
    POLICY_FINDING_CODES=()
    POLICY_FINDING_MESSAGES=()
    load_identities
''')

          p = Path('src/fleet.sh')
          s = p.read_text()
          marker = 'json_command_result() {'
          pos = s.find(marker)
          if pos < 0 or s.find(marker, pos + 1) >= 0:
              raise SystemExit('src/fleet.sh: JSON renderer marker not found exactly once')
          new_tail = r'''json_findings_result() {
    local command_name="$1" rc="$2" source="$3" i first=1
    local -a codes messages
    local issues="" findings=""
    if [[ "$source" == "audit" ]]; then
        codes=("${AUDIT_FINDING_CODES[@]}")
        messages=("${AUDIT_FINDING_MESSAGES[@]}")
    else
        codes=("${POLICY_FINDING_CODES[@]}")
        messages=("${POLICY_FINDING_MESSAGES[@]}")
    fi
    for i in "${!messages[@]}"; do
        if (( first == 0 )); then
            issues="$issues,"
            findings="$findings,"
        fi
        issues="$issues\"$(json_escape "${messages[$i]}")\""
        findings="$findings{\"code\":\"$(json_escape "${codes[$i]}")\",\"severity\":\"warning\",\"message\":\"$(json_escape "${messages[$i]}")\"}"
        first=0
    done
    printf '{"command":"%s","version":"%s","ok":%s,"exit_code":%d,"issue_count":%d,"issues":[%s],"findings":[%s]}\n' \
        "$(json_escape "$command_name")" "$(json_escape "$VERSION")" \
        "$([[ "$rc" == "0" ]] && printf true || printf false)" "$rc" "${#messages[@]}" "$issues" "$findings"
}

audit_json() {
    local tmp rc=0
    local C_ACCENT="" C_SILVER="" C_MUTED="" C_DIM="" C_GREEN="" C_YELLOW="" C_RED="" C_BOLD="" C_RESET=""
    tmp=$(mktemp "$CONFIG_DIR/audit-json.XXXXXX") || return 1
    audit > "$tmp" 2>&1 || rc=$?
    rm -f "$tmp"
    json_findings_result audit "$rc" audit
    return "$rc"
}

policy_check_json() {
    local tmp rc=0
    local C_ACCENT="" C_SILVER="" C_MUTED="" C_DIM="" C_GREEN="" C_YELLOW="" C_RED="" C_BOLD="" C_RESET=""
    tmp=$(mktemp "$CONFIG_DIR/policy-json.XXXXXX") || return 1
    policy_check > "$tmp" 2>&1 || rc=$?
    rm -f "$tmp"
    json_findings_result policy-check "$rc" policy
    return "$rc"
}
'''
          p.write_text(s[:pos] + new_tail)

          p = Path('tests/fleet_test.sh')
          s = p.read_text()
          old = '''assert_true "policy JSON exposes issue count" grep -Fq '\"issue_count\":2' <<< "$json_drift"
'''
          new = old + '''assert_true "policy JSON exposes structured findings" grep -Fq '\"findings\":[' <<< "$json_drift"
assert_true "policy JSON uses a stable missing-policy code" grep -Fq '\"code\":\"POLICY_MISSING\"' <<< "$json_drift"
assert_true "policy JSON uses a stable excess-policy code" grep -Fq '\"code\":\"POLICY_EXCESS\"' <<< "$json_drift"
'''
          if s.count(old) != 1:
              raise SystemExit('tests/fleet_test.sh: policy JSON assertion target missing')
          s = s.replace(old, new)
          old2 = '''assert_true "audit JSON contains desired-state drift" grep -Fq "EXCESS identity 'phone'" <<< "$audit_drift"
'''
          new2 = old2 + '''assert_true "audit JSON emits stable structured policy codes" grep -Fq '\"code\":\"POLICY_EXCESS\"' <<< "$audit_drift"
'''
          if s.count(old2) != 1:
              raise SystemExit('tests/fleet_test.sh: audit JSON assertion target missing')
          p.write_text(s.replace(old2, new2))
          PY
      - name: Commit structured JSON model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/identities.sh src/policy.sh src/fleet.sh tests/fleet_test.sh
          git commit -m "refactor: emit JSON from structured trust findings"
          git push origin HEAD:feat/v1.5-security-hardening
