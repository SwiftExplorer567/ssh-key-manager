name: V1.5 Validation

on:
  push:
    branches:
      - feat/v1.5-security-hardening

permissions:
  contents: read

jobs:
  source-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ShellCheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install shellcheck
      - name: Build, test, and lint source
        run: make test && make lint
