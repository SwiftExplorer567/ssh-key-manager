name: Feature v1.4 Build

on:
  push:
    branches:
      - feat/fleet-config-automation

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply v1.4 integration
        run: python3 tools/apply_v14.py

      - name: Build generated executable
        run: make build

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Verify generated executable
        run: make check-generated

      - name: Commit validated v1.4 integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_v14.py .github/workflows/feature-v14-build.yml
          git add src/runtime.sh src/cli.sh src/fleet.sh install.sh \
            build/bundle.sh build/lint.sh remote/identities_replace.sh \
            tests/test.sh tests/fleet_test.sh docs/fleet-automation.md \
            ssh-key-manager ssh-key-manager.sha256
          git commit -m "feat: integrate fleet configuration automation"
          git push origin HEAD:feat/fleet-config-automation
