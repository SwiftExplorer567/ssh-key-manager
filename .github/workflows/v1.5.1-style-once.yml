name: V1.5.1 Hotfix Formatting Once

on:
  push:
    branches:
      - fix/v1.5.1-settings-permissions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v1.5.1-settings-permissions
      - name: Normalize formatting and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime.sh')
          s = p.read_text()
          old = '''    if [[ -f "$SETTINGS_FILE" && ! -L "$SETTINGS_FILE" ]]; then
          chmod 600 "$SETTINGS_FILE" 2>/dev/null || true
          fi
          '''
          new = '''    if [[ -f "$SETTINGS_FILE" && ! -L "$SETTINGS_FILE" ]]; then
              chmod 600 "$SETTINGS_FILE" 2>/dev/null || true
          fi
          '''
          if s.count(old) != 1:
              raise SystemExit(f'format block count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          ./build/bundle.sh
          make ci
      - name: Commit formatting cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v1.5.1-style-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime.sh ssh-key-manager ssh-key-manager.sha256 .github/workflows/v1.5.1-style-once.yml
          git commit -m "style: normalize v1.5.1 hotfix formatting"
          git push origin HEAD:fix/v1.5.1-settings-permissions
