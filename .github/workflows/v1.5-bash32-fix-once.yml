name: V1.5 Bash 3.2 Fix Once

on:
  push:
    branches:
      - feat/v1.5-security-hardening
    paths:
      - .github/workflows/v1.5-bash32-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v1.5-security-hardening
          fetch-depth: 0
      - name: Apply Bash 3.2 compatibility patch
        run: python3 .github/v1.5_bash32_patch.py
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Rebuild and validate
        run: |
          make build
          make ci
      - name: Commit verified compatibility fix
        run: |
          rm -f .github/v1.5_bash32_patch.py
          rm -f .github/workflows/v1.5-bash32-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: support empty arrays on Bash 3.2"
          git push origin HEAD:feat/v1.5-security-hardening
