name: V1.5 Fix Lint Once

on:
  push:
    branches:
      - feat/v1.5-security-hardening
    paths:
      - .github/workflows/v1.5-fix-lint-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v1.5-security-hardening
      - name: Patch explicit remote metadata validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/fleet.sh')
          s = p.read_text()
          old = '                valid_name "$a" && valid_fingerprint "$b" && valid_identity_type "$c" && valid_identity_status "$d" || { fail "Remote identity registry contains invalid metadata."; return 1; }\n'
          new = '                if ! valid_name "$a" || ! valid_fingerprint "$b" || ! valid_identity_type "$c" || ! valid_identity_status "$d"; then\n                    fail "Remote identity registry contains invalid metadata."\n                    return 1\n                fi\n'
          if s.count(old) != 1:
              raise SystemExit('expected validation expression not found exactly once')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fleet.sh
          git commit -m "fix: make remote metadata validation explicit"
          git push origin HEAD:feat/v1.5-security-hardening
