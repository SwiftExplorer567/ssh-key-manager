name: V1.5.1 Hotfix Formatting Final Once

on:
  push:
    branches:
      - fix/v1.5.1-settings-permissions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v1.5.1-settings-permissions
      - name: Normalize formatting and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime.sh')
          lines = p.read_text().splitlines()
          hits = [i for i, line in enumerate(lines) if 'if [[ -f "$SETTINGS_FILE" && ! -L "$SETTINGS_FILE" ]]' in line]
          if len(hits) != 1:
              raise SystemExit(f'settings permission block count={len(hits)}')
          i = hits[0]
          if i + 2 >= len(lines) or 'chmod 600 "$SETTINGS_FILE"' not in lines[i + 1] or lines[i + 2].strip() != 'fi':
              raise SystemExit('unexpected settings permission block shape')
          lines[i] = '    if [[ -f "$SETTINGS_FILE" && ! -L "$SETTINGS_FILE" ]]; then'
          lines[i + 1] = '        chmod 600 "$SETTINGS_FILE" 2>/dev/null || true'
          lines[i + 2] = '    fi'
          p.write_text('\n'.join(lines) + '\n')
          PY
          ./build/bundle.sh
          make ci
      - name: Commit formatting cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v1.5.1-style-once.yml .github/workflows/v1.5.1-style-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize v1.5.1 hotfix formatting"
          git push origin HEAD:fix/v1.5.1-settings-permissions
